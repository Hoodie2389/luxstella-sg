<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Lux Stella</title>
    <meta name="description" content="Get in touch with Luxstella.sg to discuss your strategic needs.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .contact-page {
            padding-top: 120px;
            min-height: 80vh;
            background-color: var(--bg-light);
            position: relative;
            z-index: 1;
        }

        .form-container {
            background: var(--white);
            padding: 3rem;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            border-top: 4px solid var(--accent-color);
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr !important;
                gap: 0 !important;
            }
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 700;
            color: var(--primary-color);
            font-size: 0.9rem;
        }

        .form-input,
        .form-textarea {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 0;
            font-family: var(--font-body);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-input:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(197, 160, 89, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 150px;
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 2rem;
            background: #d4edda;
            color: #155724;
            border-radius: 4px;
            margin-top: 2rem;
        }

        .success-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <svg width="32" height="32" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"
                    class="logo-icon">
                    <path d="M20 0L24.5 15.5L40 20L24.5 24.5L20 40L15.5 24.5L0 20L15.5 15.5L20 0Z" fill="#C5A059" />
                </svg>
                LUX STELLA
            </a>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="index.html#about">About</a></li>
                    <li><a href="index.html#services">Services</a></li>
                    <li><a href="index.html#insights">Insights</a></li>
                    <li><a href="contact.html" class="btn btn-outline">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contact-page section">
        <div class="container">
            <div class="section-header text-center">
                <h1 class="section-title">Get in Touch</h1>
                <p class="section-subtitle">Start the conversation about your future.</p>
            </div>

            <div class="form-container">
                <form id="contactForm">
                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" class="form-input" required placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="tel" id="phone" class="form-input" placeholder="+65 9123 4567">
                        </div>
                    </div>
                    <div class="form-row" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                        <div class="form-group">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-input" required placeholder="john@company.com">
                        </div>
                        <div class="form-group">
                            <label for="industry" class="form-label">Industry</label>
                            <select id="industry" class="form-input" style="height: 52px;">
                                <option value="" disabled selected>Select Industry</option>
                                <option value="finance">Finance & Banking</option>
                                <option value="technology">Technology & Digital</option>
                                <option value="manufacturing">Manufacturing</option>
                                <option value="healthcare">Healthcare</option>
                                <option value="retail">Retail & Consumer</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="subject" class="form-label">Subject</label>
                        <input type="text" id="subject" class="form-input" required
                            placeholder="Strategic Partnership Inquiry">
                    </div>
                    <div class="form-group">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" class="form-textarea" required
                            placeholder="Tell us about your organization's goals..."></textarea>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-container"
                            style="display: flex; align-items: center; font-size: 0.9rem; color: #666;">
                            <input type="checkbox" required style="margin-right: 10px;">
                            I agree to the <a href="privacy.html"
                                style="color: var(--primary-color); margin-left: 4px;">Privacy Policy</a>.
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                </form>

                <div class="success-message" id="successMessage">
                    <div class="success-icon">✓</div>
                    <h3>Message Sent Successfully</h3>
                    <p>Thank you for reaching out. Our team will get back to you within 24 hours.</p>
                    <a href="index.html" class="link-arrow" style="margin-top: 1rem; display: inline-block;">Return
                        Home</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Lux Stella. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            this.style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>
</body>

</html>
